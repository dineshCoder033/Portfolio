<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%235c6753'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='%23fff' font-family='monospace' font-weight='bold'>P</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dinesh - Software Developer & Web Designer</title>
    <!-- Google Fonts: Space Mono & Plus Jakarta Sans & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              sage: {
                50: '#f5f6f3',
                100: '#e8ebe4',
                200: '#d2d8cb',
                300: '#b4bfab',
                400: '#94a289',
                500: '#76856c',
                600: '#5c6753',
                700: '#4a5443',
                800: '#3c4336',
                900: '#32382e',
              },
              cream: {
                50: '#fdfcf9',
                100: '#faf7f0',
                200: '#f4efe4',
                300: '#ece3d2',
                400: '#e0d2bb',
              },
              terracotta: {
                DEFAULT: '#c77843',
                dark: '#b36431',
                light: '#de8d59',
              },
              folder: {
                yellow: '#f4cf65',
                dark: '#dfb547',
                tab: '#6bb6e8',
              }
            },
            fontFamily: {
              mono: ['"Space Mono"', 'monospace'],
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              display: ['"Outfit"', 'sans-serif'],
              syne: ['"Syne"', 'sans-serif'],
            },
            boxShadow: {
              'retro': '4px 4px 0px #3d4336',
              'retro-lg': '6px 6px 0px #3d4336',
              'retro-xl': '8px 8px 0px #32382e',
              'retro-sm': '2px 2px 0px #3d4336',
            }
          }
        }
      }
    </script>
    <style>
      /* Graph Paper Grid Background */
      .bg-grid-pattern {
        background-color: #f1ede4;
        background-image: 
          linear-gradient(to right, rgba(100, 115, 90, 0.12) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(100, 115, 90, 0.12) 1px, transparent 1px);
        background-size: 28px 28px;
      }
      
      /* Subtle scanlines or paper grain */
      .paper-texture {
        position: relative;
      }
      .paper-texture::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        opacity: 0.035;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        z-index: 9999;
      }

      /* Custom scrollbar for retro windows */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f4efe4;
        border-left: 1px solid #d2d8cb;
      }
      ::-webkit-scrollbar-thumb {
        background: #94a289;
        border-radius: 4px;
        border: 2px solid #f4efe4;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #5c6753;
      }
    </style>
  </head>
  <body class="bg-grid-pattern text-[#353930] min-h-screen selection:bg-sage-600 selection:text-white font-sans antialiased overflow-x-hidden paper-texture">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
